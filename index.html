<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen de YouTube</title>
<style>
  :root { --bg:#f5f5f4; --panel:#fff; --borde:#e2e2e0; --texto:#1c1c1a; --suave:#6b6b66; --acento:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --panel:#1f1f1d; --borde:#33332f; --texto:#ececea; --suave:#9a9a94; --acento:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--texto); }
  header { padding:16px 24px; font-weight:600; font-size:18px; }
  main { display:grid; grid-template-columns: 1fr 1.6fr; gap:16px; padding:0 24px 24px; height:calc(100vh - 60px); }
  @media (max-width: 760px) { main { grid-template-columns:1fr; height:auto; padding:0 16px 16px; } }
  .caja { background:var(--panel); border:1px solid var(--borde); border-radius:12px; display:flex; flex-direction:column; min-height:0; }
  .caja h2 { margin:0; padding:12px 16px; font-size:14px; color:var(--suave); border-bottom:1px solid var(--borde); font-weight:500; }
  #historial { flex:1; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; min-height:60px; }
  .burbuja { align-self:flex-end; background:var(--acento); color:#fff; padding:8px 12px; border-radius:12px; max-width:90%; word-break:break-all; cursor:pointer; font-size:14px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--borde); }
  input { flex:1; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid var(--borde); background:var(--bg); color:var(--texto); font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--acento); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #resultado { flex:1; overflow:auto; padding:16px 20px; line-height:1.55; }
  #resultado h4 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--suave); }
  .resumen { white-space:pre-wrap; }
  .vacio { color:var(--suave); }
  .error { color:#dc2626; }
</style>
</head>
<body>
<header>Resumen de YouTube</header>
<main>
  <section class="caja">
    <h2>Pega el link de un video de YouTube</h2>
    <div id="historial"></div>
    <form id="form">
      <input id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" autofocus>
      <button id="boton">Resumir</button>
    </form>
  </section>
  <section class="caja">
    <h2>Resumen</h2>
    <div id="resultado"><p class="vacio">Aquí aparecerá el resumen del video.</p></div>
  </section>
</main>
<script>
// Webhook del flujo "RESUMEN DE YOUTUBE PRUEBA" en n8n (debe estar publicado).
const N8N_WEBHOOK = 'https://n8n-che1.srv2133307.hstgr.cloud/webhook/youtube-resumen';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esYouTube = u => /(youtube\.com|youtu\.be)\//i.test(u) || /^[a-zA-Z0-9_-]{11}$/.test(u);

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!url) return;
  if (!esYouTube(url)) {
    $('resultado').innerHTML = '<p class="error">Ese no parece un link de YouTube.</p>';
    return;
  }
  const b = document.createElement('div');
  b.className = 'burbuja'; b.textContent = url; b.title = 'Volver a resumir';
  b.onclick = () => resumir(url);
  $('historial').appendChild(b);
  $('historial').scrollTop = 1e9;
  $('url').value = '';
  resumir(url);
});

async function resumir(url) {
  $('boton').disabled = true;
  $('resultado').innerHTML = '<p class="vacio">Enviando a n8n… el resumen puede tardar un minuto.</p>';
  try {
    const r = await fetch(N8N_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: url })
    });
    const texto = await r.text();
    if (r.status === 404) throw new Error('n8n no encontró el webhook: revisa que el flujo esté publicado.');
    if (!r.ok) throw new Error(`n8n respondió ${r.status}: ${texto.slice(0, 300)}`);
    const html = esc(texto).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    $('resultado').innerHTML = `<h4>Resumen</h4><div class="resumen">${html}</div>`;
  } catch (err) {
    const msg = err.message === 'Failed to fetch' ? 'No hay conexión con n8n (revisa internet o CORS del webhook).' : err.message;
    $('resultado').innerHTML = `<p class="error">No se pudo resumir el video: ${esc(msg)}</p>`;
  } finally {
    $('boton').disabled = false;
    $('resultado').scrollTop = 0;
  }
}
</script>
</body>
</html>
